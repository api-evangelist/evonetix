name: Evonetix
description: >-
  Evonetix is a Cambridge, UK deep-technology company developing a benchtop DNA
  synthesis platform built on semiconductor technology. Its core innovation is a
  silicon chip carrying thousands of independently thermally-controlled reaction
  sites, allowing many DNA strands to be synthesised in parallel with per-site
  temperature control, in-process error detection and correction, and assembly
  of high-fidelity genes at the desktop. The company's goal is to give synthetic
  biology, life-science, and drug-discovery researchers accurate, on-demand
  access to synthetic DNA without relying on centralised outsourced gene
  foundries. Evonetix was surfaced as a portfolio company of the deep-tech
  venture firm DCVC and added to the API Evangelist network. As of this
  enrichment pass the company publishes no public API, developer portal, or SDK,
  and its primary web domain (evonetix.com) resolves to a suspended-account
  placeholder page.
